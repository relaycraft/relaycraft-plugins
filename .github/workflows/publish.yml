name: Build and Publish Plugins

on:
  push:
    branches:
      - main
    paths:
      - '**/plugin.yaml'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/locales/**'
      - '**/settings.json'
      - '**/*.svg'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Opt into Node 24 for JS-based actions (GitHub deprecation of Node 20 on runners).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # pnpm MUST be available before actions/setup-node when using cache: pnpm
      # (otherwise setup-node cannot resolve the pnpm executable).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pnpm install --frozen-lockfile

      - name: Build UI plugins (optional build mode)
        run: node scripts/build_ui_plugins.mjs

      - name: Build Plugins and Update Registry
        id: build
        run: python scripts/build_plugins.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Commit plugins.json changes
        if: steps.build.outputs.should_release == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update plugins registry [skip ci]" && git push)

      - name: Create Releases
        if: steps.build.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releases = JSON.parse(fs.readFileSync('releases_to_create.json', 'utf8'));
            
            // 1. Create individual plugin releases
            for (const release of releases) {
              console.log(`Creating release: ${release.release_name} (${release.tag_name})`);
              
              const createResponse = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: release.tag_name,
                name: release.release_name,
                body: release.body,
                draft: false,
                prerelease: false,
                make_latest: "false"
              });
              
              const uploadUrl = createResponse.data.upload_url;
              
              for (const filePath of release.files) {
                const fileName = filePath.split('/').pop();
                const fileData = fs.readFileSync(filePath);
                
                console.log(`  Uploading asset: ${fileName}`);
                
                await github.rest.repos.uploadReleaseAsset({
                  url: uploadUrl,
                  headers: {
                    "content-type": "application/zip",
                    "content-length": fileData.length
                  },
                  name: fileName,
                  data: fileData
                });
              }
            }

            // 2. Create or update the "All Plugins" release
            const plugins = JSON.parse(fs.readFileSync('plugins.json', 'utf8'));
            const versionsData = {
              version: plugins.version,
              updated: new Date().toISOString(),
              plugins: plugins.plugins.map(p => ({
                id: p.id,
                name: p.name,
                version: p.version,
                description: p.description,
                category: p.category,
                downloadUrl: p.downloadUrl,
                locales: p.locales
              }))
            };
            
            fs.writeFileSync('versions.json', JSON.stringify(versionsData, null, 2));
            
            // Try to find existing "all-plugins" release, delete it if exists
            const existingReleases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const existingAllPlugins = existingReleases.data.find(r => r.tag_name === 'all-plugins');
            if (existingAllPlugins) {
              console.log(`Deleting existing all-plugins release (${existingAllPlugins.id})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existingAllPlugins.id
              });
              // Also delete the tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'tags/all-plugins'
                });
              } catch (e) {
                // Tag may not exist, ignore
              }
            }
            
            // Create new "all-plugins" release
            const allPluginsBody = `# All Plugins\n\nDownload all available plugins from www.relaycraft.dev/zh/plugins\n\n## Latest Versions\n\n${plugins.plugins.map(p => `- **${p.name}** v${p.version} - ${p.description}`).join('\n')}\n\nDownload the \`versions.json\` file to get structured data with all download URLs.`;
            
            console.log('Creating "all-plugins" release');
            const allPluginsRelease = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'all-plugins',
              name: 'All Plugins',
              body: allPluginsBody,
              draft: false,
              prerelease: false,
              make_latest: "true"
            });
            
            // Upload versions.json
            const versionsDataBuffer = fs.readFileSync('versions.json');
            await github.rest.repos.uploadReleaseAsset({
              url: allPluginsRelease.data.upload_url,
              headers: {
                "content-type": "application/json",
                "content-length": versionsDataBuffer.length
              },
              name: 'versions.json',
              data: versionsDataBuffer
            });
            console.log('Uploaded versions.json to all-plugins release');
